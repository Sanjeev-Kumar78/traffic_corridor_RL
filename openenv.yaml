name: traffic_corridor_pro
version: 3.0.0
spec_version: 1
description: Real-world traffic signal control environment with emergency-priority corridor coordination.
default_image: traffic-corridor-pro:latest
action:
  class_name: TrafficAction
  module: environment
observation:
  class_name: TrafficObservation
  module: environment
reward:
  class_name: RewardModel
  module: environment
tasks:
  - id: easy_4_phase
    description: Single balanced intersection with four legal phases and moderate load.
  - id: medium_asymmetric
    description: Single asymmetric intersection where north-south traffic dominates demand.
  - id: hard_corridor_emergency
    description: Three-intersection corridor with emergency vehicle injection and downstream handoff.
